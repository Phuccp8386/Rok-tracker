name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve base path
        id: base
        env:
          OVERRIDE: ${{ vars.VITE_BASE_PATH }}
          REPO_NAME: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # A project site lives at https://<owner>.github.io/<repo>/ and needs
          # a base path of "/<repo>/". A user site lives at the domain root and
          # needs an empty base path - that is the case where the repository
          # name matches the owner name.
          #
          # Deriving this from the checkout means the workflow works with no
          # manual configuration. Set the VITE_BASE_PATH repository variable
          # to override it, for example when serving from a custom domain.
          if [ -n "$OVERRIDE" ]; then
            base="$OVERRIDE"
          elif [ "$REPO_NAME" = "$OWNER" ]; then
            base=""
          else
            base="/$REPO_NAME/"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "Base path resolved to: '$base'"

      - name: Build
        env:
          VITE_BASE_PATH: ${{ steps.base.outputs.base }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
